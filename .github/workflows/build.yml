name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'RYMICRO Studio.exe' dist
          Copy-Item web dist\web -Recurse
          Copy-Item start.cmd dist
          Copy-Item README.md, LICENSE dist
          Copy-Item docs dist\docs -Recurse
          Compress-Archive -Path dist\* -DestinationPath RYMICRO-Studio.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RYMICRO-Studio
          path: RYMICRO-Studio.zip
